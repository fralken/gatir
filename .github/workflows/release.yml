name: Release

# A tag that starts with "v" makes a release: the archives of every target and a
# file of their checksums are published on GitHub. The workflow can also be run by
# hand, from the Actions tab, to see what a release would hold: it builds and
# packs everything, and publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: the tag is the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "the version in Cargo.toml is ${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} is not v${version}, the version in Cargo.toml"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest system that is offered, so that the program runs
          # on the ones after it.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install what the TLS binding needs to build, and the Kerberos library the tests load
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libgssapi-krb5-2
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        run: cargo test --workspace --locked
      - name: Pack
        shell: bash
        run: scripts/package.sh ${{ matrix.target }}
      - name: Make the .deb and the .rpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm
          scripts/package-linux.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: gatir-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: gatir-*
          merge-multiple: true
          path: dist
      - name: Collect the checksums, and check them once more
        working-directory: dist
        run: |
          cat ./*.sha256 | sort -k 2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -l
      - name: Write the Homebrew formula of this release
        run: scripts/homebrew-formula.sh "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" dist/SHA256SUMS > dist/gatir.rb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/SHA256SUMS dist/gatir.rb \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
