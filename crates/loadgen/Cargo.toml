[package]
name = "gatir-loadgen"
description = "Load-tests an HTTP proxy: gatir, or any other, through hyper's own low-level client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "gatir-loadgen"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
gatir-testkit = { path = "../testkit" }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
