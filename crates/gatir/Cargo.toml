[package]
name = "gatir"
description = "Authenticating HTTP proxy for corporate proxies (NTLM, Kerberos, SSPI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "gatir"
path = "src/lib.rs"

[[bin]]
name = "gatir"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
gatir-testkit = { path = "../testkit" }
predicates = "3.1.4"
tempfile = "3.27.0"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
des = "0.9.0"
gethostname = "1.1.0"
getrandom = "0.4.3"
globset = "0.4.20"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-graceful"] }
ipnet = "2.12.2"
md-5 = "0.11.0"
md4 = "0.11.0"
native-tls = "0.2.18"
rpassword = "7.5.4"
rquickjs = "0.14"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
tokio-native-tls = "0.3.1"
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.0"

[target."cfg(unix)".dependencies]
libloading = "0.8.9"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials"] }
