[package]
name = "gatir"
description = "Authenticating HTTP proxy for corporate proxies (NTLM, Kerberos, SSPI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gatir"
path = "src/lib.rs"

[[bin]]
name = "gatir"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
gatir-testkit = { path = "../testkit" }
predicates = "3.1.4"
tempfile = "3.27.0"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
hex = "0.4.3"
ipnet = "2.12.2"
rpassword = "7.5.4"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.0"
