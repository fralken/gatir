# An example configuration for gatir. Copy it to ~/.config/gatir/gatir.toml,
# or name the copy with --config, and edit it. Every name and value here is made
# up.
#
# Commented-out settings are optional: remove the leading "# " to turn one on.
# docs/settings.md lists every setting, with its default.

# Where gatir listens for programs that use an HTTP proxy. Keep it on the
# loopback: anyone who can connect uses your identity. Write IP addresses, not
# names. IPv4 and IPv6 are separate: to listen on both, also add "[::1]:3128".
listen = ["127.0.0.1:3128"]

# Your company's proxy. List several to try them in order. A PAC script (see
# [pac] below) is the other way to choose the proxy: use one or the other.
parents = ["proxy.example.com:8080"]

# Destinations reached directly, without the proxy. A name matches only itself:
# write "*.example.com" for its sub-domains. * stands for any text, ? for one
# character. Addresses and ranges match only when a program asks for an
# address, not for a name.
no_proxy = ["localhost", "127.0.0.1", "*.internal.example.com", "10.0.0.0/8"]

[credentials]
# ntlmv2 (the default), ntlm2sr or nt. Or negotiate, which uses the Kerberos
# ticket of the logged-in user and needs no password.
method = "ntlmv2"
username = "alice"
domain = "EXAMPLE"
# The password, or the hash of it that `gatir hash` prints, which keeps the
# password itself out of this file. Either way, make the file readable by you
# only (chmod 600).
password = "change-me"
# nt_hash = "0123456789abcdef0123456789abcdef"

# Servers reached directly that ask for NTLM themselves (a 401, not the
# proxy's 407), such as an intranet site with Windows sign-in. gatir answers
# them with the credentials above. Same patterns as no_proxy. Without this
# list, gatir leaves a server's 401 to the program.
# origin_hosts = ["intranet.example.com", "*.corp.example.com"]

# A PAC script that chooses the proxy for each request. Name it in one of three
# ways: a file, an address, or (on macOS and Windows) the one your system's
# proxy settings use.
# [pac]
# file = "proxy.pac"
# url = "https://pac.example.com/proxy.pac"
# system = true
# How often to check the script for changes, in seconds. If you leave it out,
# it depends on where the script is: every 60 seconds for a file or the
# system's script, every hour for an address.
# refresh_secs = 300
#
# Hosts that go to other proxies than the script says. The first entry that
# lists a host decides. Here a name also covers its sub-domains, and * and ?
# are wildcards. The proxy is DIRECT, or PROXY host:port; separate several with
# semicolons to try them in order.
# [[pac.overrides]]
# hosts = ["downloads.example.com", "*.cdn.example.net"]
# proxy = "PROXY a.example.com:80; PROXY b.example.com:80"

# Which programs may use gatir, by the address they connect from. The first
# rule that matches decides. Needed if gatir listens beyond the loopback.
# [access]
# default = "deny"
# rules = [{ allow = "127.0.0.1" }, { allow = "192.168.0.0/16" }]

# Header fields added to every request sent through the proxy, replacing the
# program's own. They are never sent to a server reached directly. The values
# are kept secret in logs.
# [headers]
# X-Example = "value"

# A local port forwarded to a fixed destination through the proxy, like ssh -L.
# [[tunnels]]
# listen = "127.0.0.1:2222"
# target = "git.example.com:22"

# A SOCKS5 server. Set both a user name and a password to require them.
# [socks5]
# listen = ["127.0.0.1:1080"]
# username = "bob"
# password = "change-me-too"

# How long to wait, in seconds. These are the defaults.
# [timeouts]
# connect_secs = 10
# client_idle_secs = 60
# response_secs = 120
# tunnel_idle_secs = 600
# shutdown_grace_secs = 10

# How much gatir logs: error, warn, info (the default), debug or trace.
# [log]
# level = "info"
