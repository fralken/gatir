[workspace]
resolver = "3"
members = ["crates/gatir", "crates/testkit", "crates/mangen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# What is shipped: small and fast, with a panic still ending only the task it
# happens in (so no `panic = "abort"`).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
